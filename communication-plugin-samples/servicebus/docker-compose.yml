name: graftcode-servicebus

services:
  servicebus:
    container_name: servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - "./middleware/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "Local123!"
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: "5300"
      SQL_WAIT_INTERVAL: "30"
    depends_on:
      mssql:
        condition: service_healthy

  mssql:
    container_name: servicebus-mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local123!"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -b -Q
          "IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE')
          THROW 50000, 'Database recovery incomplete', 1;"
          > /dev/null
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  servicebus-ready:
    image: curlimages/curl:8.16.0
    depends_on:
      servicebus:
        condition: service_started
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "30"
      - --retry-delay
      - "2"
      - --retry-all-errors
      - http://servicebus:5300/health

  server:
    container_name: graftcode-servicebus-server
    image: graftcode-servicebus-server
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        PLUGIN_NAME: servicebus
    depends_on:
      servicebus-ready:
        condition: service_completed_successfully
    ports:
      - "10301:10301"
      - "10401:10401"

  server-2:
    container_name: graftcode-servicebus-server-2
    image: graftcode-servicebus-server
    depends_on:
      servicebus-ready:
        condition: service_completed_successfully

  server-3:
    container_name: graftcode-servicebus-server-3
    image: graftcode-servicebus-server
    depends_on:
      servicebus-ready:
        condition: service_completed_successfully
