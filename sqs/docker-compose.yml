services:
  localstack:
    image: localstack/localstack:4.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 0
    volumes:
      - localstack-data:/var/lib/localstack
      # Same init script as samples/sqs so `docker compose up` creates the queues.
      - ../samples/sqs/scripts/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh

volumes:
  localstack-data:
