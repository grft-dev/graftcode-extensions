[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graftcode-telemetry-appinsights"
version = "1.0.0"
description = "Application Insights connector for Graftcode / Hypertube telemetry in Python"
readme = "README.md"
authors = [{ name = "Graftcode S.A.", email = "support@graftcode.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "azure-monitor-opentelemetry-exporter>=1.0.0b40",
    "graftcode-instrumentation>=1.0.0",
    "hypertube-python-sdk>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "starlette",
    "httpx",
]

[tool.setuptools]
packages = ["graftcode_telemetry_appinsights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
