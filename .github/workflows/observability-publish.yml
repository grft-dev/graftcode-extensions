name: Observability Packages

on:
  push:
    branches: ["main"]
    tags:
      - "observability-v*"
    paths:
      - "observability/**"
      - ".github/workflows/observability-publish.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "observability/**"
      - ".github/workflows/observability-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Build and test observability packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test .NET instrumentation
        run: dotnet test observability/Instrumentation/dotnet/tests/Graftcode.Instrumentation.Tests/Graftcode.Instrumentation.Tests.csproj --configuration Release

      - name: Test .NET AppInsights connector
        run: dotnet test observability/opentelemetry/dotnet/appinsights/GraftCode.Netcore.Telemetry.AppInsightsConnector.Tests/GraftCode.Netcore.Telemetry.AppInsightsConnector.Tests.csproj --configuration Release

      - name: Test Java instrumentation
        run: mvn --batch-mode --file observability/Instrumentation/java/pom.xml install

      - name: Test Java AppInsights connector
        run: mvn --batch-mode --file observability/opentelemetry/java/appinsights/pom.xml verify

      - name: Test Python packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'observability/Instrumentation/python[dev]'
          python -m pip install -e 'observability/opentelemetry/python/appinsights[dev]'
          python -m pytest observability/Instrumentation/python/tests observability/opentelemetry/python/appinsights/tests

      - name: Check Node.js package archives
        shell: bash
        run: |
          set -euo pipefail
          (cd observability/Instrumentation/nodejs && npm pack --dry-run --json)
          (cd observability/opentelemetry/nodejs/appinsights && npm pack --dry-run --json)

  publish:
    name: Publish observability packages
    needs: validate
    if: >-
      success() && (
        startsWith(github.ref, 'refs/tags/observability-v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    environment: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
          else
            version="${GITHUB_REF_NAME#observability-v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate to NuGet with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dskowron

      - name: Pack and publish NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          dotnet pack observability/Instrumentation/dotnet/src/Graftcode.Instrumentation/Graftcode.Instrumentation.csproj \
            --configuration Release --property:PackageVersion="${VERSION}" --output artifacts/nuget
          dotnet pack observability/opentelemetry/dotnet/appinsights/GraftCode.Netcore.Telemetry.AppInsightsConnector/GraftCode.Netcore.Telemetry.AppInsightsConnector.csproj \
            --configuration Release --property:PackageVersion="${VERSION}" --output artifacts/nuget
          dotnet nuget push artifacts/nuget/*.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish Maven Central packages
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mvn --batch-mode --file observability/Instrumentation/java/pom.xml \
            --activate-profiles publish --define revision="${VERSION}" deploy
          mvn --batch-mode --file observability/opentelemetry/java/appinsights/pom.xml \
            --activate-profiles publish --define revision="${VERSION}" \
            --define graftcode.instrumentation.version="${VERSION}" deploy

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Python packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade build tomlkit
          mkdir -p artifacts/pypi
          for package in \
            observability/Instrumentation/python \
            observability/opentelemetry/python/appinsights; do
            PACKAGE_DIR="${package}" python - <<'PY'
          import os
          from pathlib import Path
          import tomlkit

          project_file = Path(os.environ["PACKAGE_DIR"]) / "pyproject.toml"
          project = tomlkit.parse(project_file.read_text())
          project["project"]["version"] = os.environ["VERSION"]
          project_file.write_text(tomlkit.dumps(project))
          PY
            python -m build --outdir artifacts/pypi "${package}"
          done

      - name: Publish Python packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PIP_PUBLISH_TOKEN }}
          packages-dir: artifacts/pypi/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Set npm package versions
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          for package in \
            observability/Instrumentation/nodejs \
            observability/opentelemetry/nodejs/appinsights; do
            (cd "${package}" && npm version "${VERSION}" --no-git-tag-version --ignore-scripts)
          done

      - name: Publish npm packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          (cd observability/Instrumentation/nodejs && npm publish --access public)
          (cd observability/opentelemetry/nodejs/appinsights && npm publish --access public)
