name: Shared Plugin Release #d

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
    paths:
      - "rabbitmq/**"
      - "servicebus/**"
      - "kafka/**"
      - "sqs/**"
      - "pubsub/**"
      - "cmake/**"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "rabbitmq/**"
      - "servicebus/**"
      - "kafka/**"
      - "sqs/**"
      - "pubsub/**"
      - "cmake/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update (for example v1.2.3)
        required: true
        type: string
      release_name:
        description: Optional release title
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build ${{ matrix.plugin }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        plugin: [rabbitmq, servicebus, kafka, sqs, pubsub]
        platform: [windows-latest, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-26-intel, macos-14]

    steps:
      - uses: actions/checkout@v5

      - name: Resolve build metadata
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows-latest)
              echo "PLATFORM_NAME=Windows" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=x86_64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=windows-x86_64" >> "$GITHUB_ENV"
              ;;
            windows-11-arm)
              echo "PLATFORM_NAME=Windows" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=arm64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=windows-arm64" >> "$GITHUB_ENV"
              ;;
            ubuntu-22.04)
              echo "PLATFORM_NAME=Linux" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=x86_64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=linux-x86_64" >> "$GITHUB_ENV"
              ;;
            ubuntu-22.04-arm)
              echo "PLATFORM_NAME=Linux" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=arm64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=linux-arm64" >> "$GITHUB_ENV"
              ;;
            macos-26-intel)
              echo "PLATFORM_NAME=macOS" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=x86_64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=macos-x86_64" >> "$GITHUB_ENV"
              ;;
            macos-14)
              echo "PLATFORM_NAME=macOS" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=arm64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=macos-arm64" >> "$GITHUB_ENV"
              ;;
          esac

          case "${{ matrix.plugin }}" in
            servicebus)
              echo "DIRECTORY=servicebus" >> "$GITHUB_ENV"
              echo "ARTIFACT_PATH=servicebus/build/ServiceBusPlugin" >> "$GITHUB_ENV"
              echo "CONFIGURE_ARGS=-DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
              if [ "${{ runner.os }}" = "Linux" ]; then
                echo "INSTALL_PACKAGES=build-essential cmake git ninja-build pkg-config patchelf" >> "$GITHUB_ENV"
              elif [ "${{ runner.os }}" = "macOS" ]; then
                echo "INSTALL_PACKAGES=cmake ninja pkg-config" >> "$GITHUB_ENV"
              else
                echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
              fi
              ;;
            sqs)
              echo "DIRECTORY=sqs" >> "$GITHUB_ENV"
              echo "ARTIFACT_PATH=sqs/build/SqsPlugin" >> "$GITHUB_ENV"
              echo "CONFIGURE_ARGS=-DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
              if [ "${{ runner.os }}" = "Linux" ]; then
                echo "INSTALL_PACKAGES=build-essential cmake git ninja-build pkg-config patchelf" >> "$GITHUB_ENV"
              elif [ "${{ runner.os }}" = "macOS" ]; then
                echo "INSTALL_PACKAGES=cmake ninja pkg-config" >> "$GITHUB_ENV"
              else
                echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
              fi
              ;;
            pubsub)
              echo "DIRECTORY=pubsub" >> "$GITHUB_ENV"
              echo "ARTIFACT_PATH=pubsub/build/PubSubPlugin" >> "$GITHUB_ENV"
              echo "CONFIGURE_ARGS=-DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
              if [ "${{ runner.os }}" = "Linux" ]; then
                echo "INSTALL_PACKAGES=build-essential cmake git ninja-build pkg-config patchelf" >> "$GITHUB_ENV"
              elif [ "${{ runner.os }}" = "macOS" ]; then
                echo "INSTALL_PACKAGES=cmake ninja pkg-config" >> "$GITHUB_ENV"
              else
                echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
              fi
              ;;
            kafka)
              echo "DIRECTORY=kafka" >> "$GITHUB_ENV"
              echo "ARTIFACT_PATH=kafka/build/KafkaPlugin" >> "$GITHUB_ENV"
              if [ "${{ runner.os }}" = "Linux" ]; then
                echo "CONFIGURE_ARGS=" >> "$GITHUB_ENV"
                echo "INSTALL_PACKAGES=build-essential cmake git libssl-dev libsasl2-dev zlib1g-dev libzstd-dev patchelf" >> "$GITHUB_ENV"
              elif [ "${{ runner.os }}" = "macOS" ]; then
                echo "CONFIGURE_ARGS=" >> "$GITHUB_ENV"
                echo "INSTALL_PACKAGES=cmake openssl zstd" >> "$GITHUB_ENV"
              else
                # Static OpenSSL/zlib built with /MT. The Program Files OpenSSL is /MD.
                echo "CONFIGURE_ARGS=-DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
                echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
              fi
              ;;
            *)
              echo "DIRECTORY=rabbitmq" >> "$GITHUB_ENV"
              echo "ARTIFACT_PATH=rabbitmq/build/RabbitmqPlugin" >> "$GITHUB_ENV"
              echo "CONFIGURE_ARGS=" >> "$GITHUB_ENV"
              if [ "${{ runner.os }}" = "Linux" ]; then
                echo "INSTALL_PACKAGES=build-essential cmake git patchelf" >> "$GITHUB_ENV"
              elif [ "${{ runner.os }}" = "macOS" ]; then
                echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
              else
                echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
              fi
              ;;
          esac

          echo "PLUGIN_NAME=${{ matrix.plugin }}" >> "$GITHUB_ENV"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.INSTALL_PACKAGES }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ${{ env.INSTALL_PACKAGES }}

      - name: Configure CMake (${{ matrix.plugin }})
        working-directory: ${{ env.DIRECTORY }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ env.CONFIGURE_ARGS }}

      - name: Build (${{ matrix.plugin }})
        working-directory: ${{ env.DIRECTORY }}
        run: |
          cmake --build build --config Release

      - name: Test (${{ matrix.plugin }})
        working-directory: ${{ env.DIRECTORY }}
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 180

      # cmake --install --component plugin-runtime copies the plugin and the
      # shared libraries it actually loads. FetchContent install rules and
      # MSVC import libraries stay out of that component.
      - name: Package (${{ matrix.plugin }})
        shell: bash
        run: |
          set -euo pipefail
          staging="${GITHUB_WORKSPACE}/package-staging"
          flat="${GITHUB_WORKSPACE}/package-flat"
          rm -rf "${staging}" "${flat}"
          mkdir -p "${staging}" "${flat}" release-payloads
          cmake --install "${DIRECTORY}/build" --config Release --prefix "${staging}" --component plugin-runtime

          find "${staging}" \( -type f -o -type l \) \( \
              -name '*.dll' -o -name '*.DLL' -o \
              -name '*.dylib' -o \
              -name '*.so' -o -name '*.so.*' \
            \) -print0 |
            while IFS= read -r -d '' shared; do
              cp -a "${shared}" "${flat}/$(basename "${shared}")"
            done

          count="$(find "${flat}" -maxdepth 1 \( -type f -o -type l \) | wc -l)"
          if [[ "${count}" -eq 0 ]]; then
            echo "error: no shared libraries installed from ${DIRECTORY}/build" >&2
            find "${staging}" -print >&2 || true
            exit 1
          fi

          stem="$(basename "${ARTIFACT_PATH}")"
          plugin_found=0
          for candidate in \
            "${flat}/${stem}.dll" \
            "${flat}/${stem}.DLL" \
            "${flat}/lib${stem}.so" \
            "${flat}/${stem}.so" \
            "${flat}/lib${stem}.dylib" \
            "${flat}/${stem}.dylib"
          do
            if [[ -e "${candidate}" ]]; then
              plugin_found=1
            fi
          done
          if compgen -G "${flat}/lib${stem}.so.*" >/dev/null || compgen -G "${flat}/${stem}.so.*" >/dev/null; then
            plugin_found=1
          fi
          if [[ "${plugin_found}" -ne 1 ]]; then
            echo "error: plugin shared library ${stem} was not installed" >&2
            find "${flat}" -maxdepth 1 -print >&2
            exit 1
          fi

          echo "Packaged shared libraries:"
          find "${flat}" -maxdepth 1 \( -type f -o -type l \) -exec basename {} \; | sort
          tar -czf "release-payloads/${PLUGIN_NAME}-${PACKAGE_SUFFIX}.tar.gz" -C "${flat}" .

      - name: Upload artifact (${{ matrix.plugin }})
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ env.PACKAGE_SUFFIX }}
          path: release-payloads/${{ env.PLUGIN_NAME }}-${{ env.PACKAGE_SUFFIX }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  approve_release:
    name: Await manual approval
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - run: echo "Waiting for manual approval before publishing the release."

  release:
    name: Publish combined release
    needs: approve_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
            if [ -n "${{ github.event.inputs.release_name }}" ]; then
              echo "RELEASE_NAME=${{ github.event.inputs.release_name }}" >> "$GITHUB_ENV"
            else
              echo "RELEASE_NAME=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "RELEASE_TAG=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=PR ${{ github.event.pull_request.number }} build" >> "$GITHUB_ENV"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "RELEASE_TAG=build-${SHORT_SHA}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Build ${SHORT_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
