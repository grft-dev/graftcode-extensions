name: Shared Plugin Release #d

on:
  push:
    branches: [ "main" ]
    paths:
      - "rabbitmq/**"
      - "servicebus/**"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "rabbitmq/**"
      - "servicebus/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update (for example v1.2.3)
        required: true
        type: string
      release_name:
        description: Optional release title
        required: false
        type: string
        default: Plugins release

jobs:
  build:
    name: Build ${{ matrix.plugin }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        plugin: [rabbitmq, servicebus]
        platform: [windows-latest, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-26-intel, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve build metadata
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows-latest)
              echo "PLATFORM_NAME=Windows" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=x86_64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=windows-x86_64" >> "$GITHUB_ENV"
              ;;
            windows-11-arm)
              echo "PLATFORM_NAME=Windows" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=arm64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=windows-arm64" >> "$GITHUB_ENV"
              ;;
            ubuntu-22.04)
              echo "PLATFORM_NAME=Linux" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=x86_64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=linux-x86_64" >> "$GITHUB_ENV"
              ;;
            ubuntu-22.04-arm)
              echo "PLATFORM_NAME=Linux" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=arm64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=linux-arm64" >> "$GITHUB_ENV"
              ;;
            macos-26-intel)
              echo "PLATFORM_NAME=macOS" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=x86_64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=macos-x86_64" >> "$GITHUB_ENV"
              ;;
            macos-14)
              echo "PLATFORM_NAME=macOS" >> "$GITHUB_ENV"
              echo "PLATFORM_ARCH=arm64" >> "$GITHUB_ENV"
              echo "PACKAGE_SUFFIX=macos-arm64" >> "$GITHUB_ENV"
              ;;
          esac

          if [ "${{ matrix.plugin }}" = "servicebus" ]; then
            echo "DIRECTORY=servicebus" >> "$GITHUB_ENV"
            echo "ARTIFACT_PATH=servicebus/build/ServiceBusPlugin" >> "$GITHUB_ENV"
            echo "CONFIGURE_ARGS=-DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
            if [ "${{ runner.os }}" = "Linux" ]; then
              echo "INSTALL_PACKAGES=build-essential cmake git ninja-build pkg-config" >> "$GITHUB_ENV"
            elif [ "${{ runner.os }}" = "macOS" ]; then
              echo "INSTALL_PACKAGES=cmake ninja pkg-config" >> "$GITHUB_ENV"
            else
              echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
            fi
          else
            echo "DIRECTORY=rabbitmq" >> "$GITHUB_ENV"
            echo "ARTIFACT_PATH=rabbitmq/build/RabbitmqPlugin" >> "$GITHUB_ENV"
            echo "CONFIGURE_ARGS=" >> "$GITHUB_ENV"
            if [ "${{ runner.os }}" = "Linux" ]; then
              echo "INSTALL_PACKAGES=build-essential cmake git" >> "$GITHUB_ENV"
            elif [ "${{ runner.os }}" = "macOS" ]; then
              echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
            else
              echo "INSTALL_PACKAGES=cmake" >> "$GITHUB_ENV"
            fi
          fi

          echo "PLUGIN_NAME=${{ matrix.plugin }}" >> "$GITHUB_ENV"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.INSTALL_PACKAGES }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ${{ env.INSTALL_PACKAGES }}

      - name: Configure CMake (${{ matrix.plugin }})
        working-directory: ${{ env.DIRECTORY }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ env.CONFIGURE_ARGS }}

      - name: Build (${{ matrix.plugin }})
        working-directory: ${{ env.DIRECTORY }}
        run: |
          cmake --build build --config Release

      - name: Package (${{ matrix.plugin }})
        run: |
          mkdir -p release-payloads
          tar -czf "release-payloads/${{ env.PLUGIN_NAME }}-${{ env.PACKAGE_SUFFIX }}.tar.gz" -C "${{ env.ARTIFACT_PATH }}" .

      - name: Upload artifact (${{ matrix.plugin }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ env.PACKAGE_SUFFIX }}
          path: release-payloads/${{ env.PLUGIN_NAME }}-${{ env.PACKAGE_SUFFIX }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  approve_release:
    name: Await manual approval
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - run: echo "Waiting for manual approval before publishing the release."

  release:
    name: Publish combined release
    needs: approve_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=${{ github.event.inputs.release_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=PR ${{ github.event.pull_request.number }} build" >> "$GITHUB_ENV"
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
