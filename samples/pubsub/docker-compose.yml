# Local Google Cloud Pub/Sub emulator for Graftcode PubSubPlugin samples.
services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: graftcode-pubsub
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
